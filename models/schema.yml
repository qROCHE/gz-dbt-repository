version: 2

sources:
  - name: raw
    schema: gz_raw_data
    description: greenweez raw data source
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: sales of greenweez - we have one row per product_id found in each order_id
        columns:
          - name: orders_id
            description: order identifier
            tests:
              - not_null
          - name: pdt_id
            description: product identifier
            tests:
              - not_null

      - name: product
        identifier: raw_gz_product
        description: purchase_price by products_id
        columns:
          - name: products_id
            description: primary key of the table
            tests:
              - unique
              - not_null

      - name: ship
        identifier: raw_gz_ship
        description: shipment_fee by order_id
        columns:
          - name: orders_id
            description: primary key of the table
            tests:
              - unique
              - not_null

      - name: raw_gz_adwords
        alias: adwords

      - name: raw_gz_bing
        alias: bing

      - name: raw_gz_criteo
        alias: criteo

      - name: raw_gz_facebook
        alias: facebook

models : 
  - name: int_campaigns
  
    description: UNION ALL of raw ad 
    columns:
      - name: (campaign_key || '-' || date_date)
        tests:
              - unique
              - not_null
              
  - name: int_campaigns_day
    description: "Aggregated daily advertising metrics (impressions, clicks, spend) per day."
    columns:
      - name: date_date
        description: "Date of aggregation."
        tests:
          - not_null
          - unique
      - name: ads_impression
        description: "Total advertising impressions on the day."
      - name: ads_clicks
        description: "Total advertising clicks on the day."
      - name: ads_cost
        description: "Total advertising spend on the day."


  - name: finance_campaigns_day
    description: >
      Mart model combining daily financial metrics with daily advertising metrics.
      Computes ads_margin as total_operational_margin minus ads_cost.
    columns:
      - name: date
        description: "Date of aggregation."
        tests:
          - not_null
          - unique
      - name: ads_margin
        description: "Operational margin minus ads cost."
      - name: average_basket
        description: "Average basket size per day."
      - name: total_operational_margin
        description: "Total operational margin before ads."
      - name: ads_cost
        description: "Advertising cost per day."
      - name: ads_impression
        description: "Advertising impressions per day."
      - name: ads_clicks
        description: "Advertising clicks per day."
      - name: total_quantity
        description: "Total quantity sold per day."
      - name: total_shipping_fees
        description: "Shipping fees collected per day."
      - name: total_logcosts
        description: "Logistic costs per day."
      - name: total_purchase_cost
        description: "Purchase cost per day."

  - name: finance_campaigns_month
    description: >
      Mart model aggregating daily financial and advertising metrics to monthly level.
      Computes ads_margin as total operational margin minus total ads cost.
    columns:
      - name: datemonth
        description: "Month of aggregation in format YYYY-MM."
        tests:
          - not_null
          - unique
      - name: ads_margin
        description: "Monthly operational margin minus ads cost."
      - name: average_basket
        description: "Average basket size per month."
      - name: total_operational_margin
        description: "Total operational margin for the month."
      - name: ads_cost
        description: "Total advertising cost for the month."
      - name: ads_impression
        description: "Total advertising impressions for the month."
      - name: ads_clicks
        description: "Total advertising clicks for the month."
      - name: total_quantity
        description: "Total quantity sold during the month."
      - name: total_purchase_cost
        description: "Total purchase cost for the month."
      - name: total_shipping_fees
        description: "Total shipping fees collected during the month."
      - name: total_logcosts
        description: "Total logistic costs for the month."